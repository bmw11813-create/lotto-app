// ===== localStorage 기반 저장소 (휴대폰/PC 영구 저장) =====
// 일반 웹(GitHub Pages 등)에서는 window.storage가 없으므로 localStorage로 직접 구현
if (typeof window.storage === 'undefined') {
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v } : null;
    },
    set: async (key, value) => { localStorage.setItem(key, value); return { key, value }; },
    delete: async (key) => {
      const had = localStorage.getItem(key) !== null;
      localStorage.removeItem(key);
      return { key, deleted: had };
    },
    list: async (prefix) => {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!prefix || k.startsWith(prefix)) keys.push(k);
      }
      return { keys };
    }
  };
}

// ===== ☁️ Supabase 클라우드 동기화 =====
// URL·anon key 는 설정 탭에서 입력해도 되고, 아래 상수에 박아 넣어도 됩니다.
// RLS 가 'x-owner-key' 헤더(= 내 동기화 키)를 검사하므로 anon key 는 공개돼도 안전합니다.
const SB_URL_CONST = '';
const SB_KEY_CONST = '';
const SB_TABLE = 'lotto_records';

const sbGet = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const sbSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

function sbConf() {
  const url = (SB_URL_CONST || sbGet('sb:url')).replace(/\/+$/, '');
  const key = SB_KEY_CONST || sbGet('sb:key');
  const owner = sbGet('sb:owner');
  return { url, key, owner, on: !!(url && key && owner) };
}

// 내 동기화 키 — 기기마다 하나. 다른 기기엔 이 값을 그대로 붙여넣으면 같은 데이터를 봅니다.
function sbEnsureOwner() {
  let o = sbGet('sb:owner');
  if (!o) {
    const b = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(b);
    o = 'lotto_' + Array.from(b).map(x => x.toString(16).padStart(2, '0')).join('');
    sbSet('sb:owner', o);
  }
  return o;
}

function sbHeaders(c) {
  return {
    'apikey': c.key,
    'Authorization': `Bearer ${c.key}`,
    'x-owner-key': c.owner,
    'Content-Type': 'application/json'
  };
}

// 로컬 회차 레코드 → 테이블 행
function sbRow(rec, owner) {
  return {
    owner, round: rec.round, date: rec.date || null,
    games: rec.games || [], win_numbers: rec.winNumbers || null,
    bonus: (rec.bonus === 0 || rec.bonus) ? rec.bonus : null,
    matches: rec.matches || null,
    // 🧪 모의 실험은 extra.mock 에 통째로 실어 보낸다 (games 와 절대 섞지 않음)
    extra: {
      backtest: !!rec.backtest, recordOnly: !!rec.recordOnly,
      mock: rec.mock || null, par: rec.par || null, updatedAt: rec.updatedAt || null
    }
  };
}

// 테이블 행 → 로컬 회차 레코드
function sbToRec(row) {
  const ex = row.extra || {};
  const rec = {
    round: row.round, date: row.date || '', games: row.games || [],
    winNumbers: row.win_numbers || null, bonus: row.bonus,
    matches: row.matches || null,
    updatedAt: ex.updatedAt || row.updated_at || null
  };
  if (ex.backtest) rec.backtest = true;
  if (ex.recordOnly) rec.recordOnly = true;
  if (ex.mock) rec.mock = ex.mock;
  if (ex.par) rec.par = ex.par;
  return rec;
}

async function sbUpsert(recs) {
  const c = sbConf();
  if (!c.on) throw new Error('동기화 미설정');
  const body = JSON.stringify(recs.map(r => sbRow(r, c.owner)));
  const res = await fetch(`${c.url}/rest/v1/${SB_TABLE}?on_conflict=owner,round`, {
    method: 'POST',
    headers: Object.assign({}, sbHeaders(c), { 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body
  });
  if (!res.ok) throw new Error(`업로드 실패 ${res.status} ${(await res.text()).slice(0, 120)}`);
  return true;
}

async function sbDeleteRound(round) {
  const c = sbConf();
  if (!c.on) return;
  try {
    await fetch(`${c.url}/rest/v1/${SB_TABLE}?owner=eq.${encodeURIComponent(c.owner)}&round=eq.${round}`,
      { method: 'DELETE', headers: sbHeaders(c) });
  } catch (e) { /* 오프라인이면 조용히 넘어간다 */ }
}

async function sbFetchAll() {
  const c = sbConf();
  if (!c.on) throw new Error('동기화 미설정');
  const res = await fetch(`${c.url}/rest/v1/${SB_TABLE}?select=*&order=round.desc`, { headers: sbHeaders(c) });
  if (!res.ok) throw new Error(`내려받기 실패 ${res.status} ${(await res.text()).slice(0, 120)}`);
  return (await res.json()).map(sbToRec);
}

// 오프라인 대기열 (회차 번호 목록)
function sbQueue() { try { return JSON.parse(sbGet('sb:queue') || '[]'); } catch (e) { return []; } }
function sbQueueAdd(round) {
  const q = sbQueue();
  if (q.indexOf(round) < 0) { q.push(round); sbSet('sb:queue', JSON.stringify(q)); }
}
function sbQueueDel(rounds) {
  const del = {};
  rounds.forEach(r => { del[r] = true; });
  sbSet('sb:queue', JSON.stringify(sbQueue().filter(r => !del[r])));
}

// ===== 🤖 자동 전략 계산 엔진 =====
// 저장된 당첨번호 기록(최근 20회)에서 7전략 설정값을 자동 산출
function computeEngine(historyRaw) {
  let history = (historyRaw || []).filter(r => r && Array.isArray(r.nums) && r.nums.length === 6);
  // 저장 데이터가 부족하면 시드 데이터로 보완
  if (history.length < 5) {
    const have = new Set(history.map(r => r.round));
    history = [...history, ...SEED_HISTORY.filter(r => !have.has(r.round))];
  }
  const h = [...history].sort((a, b) => b.round - a.round).slice(0, 20); // 최신 20회
  const recent = [...h].reverse(); // 오래된→최신

  const freq = {};
  for (let i = 1; i <= 45; i++) freq[i] = 0;
  for (const r of h) for (const n of r.nums) freq[n]++;

  const lastSeen = {};
  for (let i = 1; i <= 45; i++) lastSeen[i] = 999;
  recent.forEach((r, idx) => {
    const ago = recent.length - 1 - idx;
    for (const n of r.nums) if (ago < lastSeen[n]) lastSeen[n] = ago;
  });

  // Y 미출현폭탄: 0회 → 없으면 1회
  let yPool = Object.keys(freq).filter(n => freq[n] === 0).map(Number);
  if (yPool.length === 0) yPool = Object.keys(freq).filter(n => freq[n] === 1).map(Number);
  const Y_fixed = yPool.slice(0, 3);

  // X 보너스추적: 최근 3회 보너스
  const recentBonuses = h.slice(0, 4).map(r => r.bonus).filter(Boolean);
  const X_fixed = [...new Set(recentBonuses)].slice(0, 3);

  // W 이월수: 직전 회차 본번호
  const W_fixed = [...h[0].nums];

  // Z 휴식회귀: 강세(빈도4+)였지만 최근 4회+ 안 나온 번호
  const strongRested = Object.keys(freq).map(Number)
    .filter(n => freq[n] >= 4 && lastSeen[n] >= 4)
    .sort((a, b) => freq[b] - freq[a]);
  const Z_fixed = strongRested.length > 0 ? strongRested.slice(0, 3) : [...Y_fixed];
  const Z_fallback = strongRested.length === 0;

  // 풀
  const sortedByFreq = Object.keys(freq).map(Number).sort((a, b) => freq[b] - freq[a]);
  const strongPool = sortedByFreq.filter(n => freq[n] >= 4).slice(0, 12);
  const oncePool = Object.keys(freq).filter(n => freq[n] <= 1).map(Number);
  const midPool = Object.keys(freq).filter(n => freq[n] === 2 || freq[n] === 3).map(Number);

  // V 끝수: 0~9 중 가장 적게 나온 끝자리 자동 추출 → 그 끝자리 번호들
  const digitCount = {};
  for (let d = 0; d <= 9; d++) digitCount[d] = 0;
  for (const r of h) for (const n of r.nums) digitCount[n % 10]++;
  const weakestDigit = Object.keys(digitCount)
    .map(Number)
    .sort((a, b) => digitCount[a] - digitCount[b])[0];
  const V_fixed = [];
  for (let n = 1; n <= 45; n++) if (n % 10 === weakestDigit) V_fixed.push(n);

  // U 합계정밀: 최근 20회 당첨합계 평균 ±13 → 자동 범위
  const sums = h.map(r => r.nums.reduce((a, c) => a + c, 0));
  const avgSum = Math.round(sums.reduce((a, c) => a + c, 0) / sums.length);
  const U_sumMin = Math.max(90, avgSum - 13);
  const U_sumMax = Math.min(190, avgSum + 13);

  // 🆕 v13 순위 산정용 지표들 --------------------------------------------
  // 보너스 이력: 몇 회전에 보너스로 나왔는지(0=직전회차) + 창 안에서 몇 번 보너스였는지
  const bonusSeen = {}, bonusCount = {};
  for (let i = 1; i <= 45; i++) { bonusSeen[i] = 999; bonusCount[i] = 0; }
  h.forEach((r, idx) => {              // h 는 최신→과거 순이라 idx 가 곧 "몇 회전"
    if (!r.bonus) return;
    bonusCount[r.bonus]++;
    if (idx < bonusSeen[r.bonus]) bonusSeen[r.bonus] = idx;
  });

  // 이월 이력: 연속한 두 회차에 모두 나온 횟수
  const carryCount = {};
  for (let i = 1; i <= 45; i++) carryCount[i] = 0;
  for (let i = 0; i + 1 < h.length; i++) {
    for (const n of h[i].nums) if (h[i + 1].nums.includes(n)) carryCount[n]++;
  }

  // 끝수 약한 순위 (0 = 가장 적게 나온 끝수)
  const digitOrder = Object.keys(digitCount).map(Number)
    .sort((a, b) => digitCount[a] - digitCount[b] || a - b);
  const digitRank = {};
  digitOrder.forEach((d, i) => { digitRank[d] = i; });

  return {
    bonusSeen, bonusCount, carryCount, digitRank,
    baseRange: `${recent[0].round}~${h[0].round}`,
    rounds: h.length, lastRound: h[0].round, freq, lastSeen,
    X_fixed, Y_fixed, Z_fixed, Z_fallback, W_fixed,
    V_fixed, weakestDigit, digitCount,
    U_sumMin, U_sumMax, avgSum,
    pools: {
      미출현: yPool.filter(n => freq[n] === 0),
      일회: oncePool, 강세: strongPool, 중간: midPool,
      하위: [...new Set([...oncePool, ...midPool])],
    },
    recentBonuses,
  };
}

// 엔진 결과 → 실제 STRATEGIES 객체 생성
function buildStrategies(eng) {
  const s = JSON.parse(JSON.stringify(STRAT_META));
  s.X.fixed = eng.X_fixed;       s.X.desc = eng.X_fixed.join('·');
  s.Y.fixed = eng.Y_fixed;       s.Y.desc = eng.Y_fixed.join('·') + ' 필수';
  s.Z.fixed = eng.Z_fixed;       s.Z.desc = eng.Z_fixed.join('·') + (eng.Z_fallback ? ' (미출현대체)' : ' 휴식회귀');
  s.W.fixed = eng.W_fixed;       s.W.desc = `${eng.lastRound}회 본번호`;
  s.V.fixed = eng.V_fixed;       s.V.desc = `끝수${eng.weakestDigit} 회귀 (${eng.V_fixed.join('·')})`;
  s.U.fixed = [];                s.U.sumMin = eng.U_sumMin;  s.U.sumMax = eng.U_sumMax;
  s.U.desc = `목표 합 ${eng.avgSum} (${eng.U_sumMin}~${eng.U_sumMax})`;
  s.T.fixed = [];                s.T.desc = '당첨 시 적게 나누는 조합';
  s.T.lastWin = eng.W_fixed;   // 직전 회차 본번호 (겹침 벌점용)
  s.C.fixed = [];                s.C.desc = '7전략 TOP3 겹침 순';
  s.R.fixed = [];                s.R.desc = '2개 이상 전략 동순위 순';
  return s;
}

function isValid(nums, sumMin = 110, sumMax = 160) {
  if (nums.length !== 6) return false;
  const s = [...nums].sort((a, b) => a - b);
  const sum = s.reduce((a, b) => a + b, 0);
  if (sum < sumMin || sum > sumMax) return false;
  const low = s.filter(n => n <= 15).length;
  const mid = s.filter(n => n >= 16 && n <= 30).length;
  const high = s.filter(n => n >= 31).length;
  if (low === 0 || mid === 0 || high === 0) return false;
  const odd = s.filter(n => n % 2 === 1).length;
  if (odd < 2 || odd > 4) return false;
  let pairs = 0;
  for (let i = 0; i < 5; i++) if (s[i + 1] - s[i] === 1) pairs++;
  if (pairs > 1) return false;
  return true;
}

// 🆕 대중성 점수: 높을수록 남들이 많이 골라 당첨 시 분배 인원↑ (나쁨)
function popularityScore(arr, lastWin) {
  const s = [...arr].sort((a, b) => a - b);
  let p = 0;
  const sum = s.reduce((a, b) => a + b, 0);
  if (sum < 100) p += 5;
  else if (sum <= 119) p += 2;
  else if (sum <= 180) p += 0;        // 스위트존
  else if (sum <= 200) p += 1;
  else p += 3;
  const highCnt = s.filter(n => n >= 32).length;     // 32+(생일대 밖) 최소 2개 유도
  p += Math.max(0, 2 - highCnt) * 2;
  let run = 1, maxRun = 1;                            // 가장 긴 연속런
  for (let i = 1; i < s.length; i++) {
    if (s[i] - s[i - 1] === 1) { run++; if (run > maxRun) maxRun = run; } else run = 1;
  }
  if (maxRun >= 3) p += 2;
  const diffs = [];                                  // 등차수열
  for (let i = 1; i < s.length; i++) diffs.push(s[i] - s[i - 1]);
  if (diffs.every(d => d === diffs[0])) p += 5;       // 6개 등차
  else {
    let arith5 = false;                              // 5개(연속 4간격) 등차
    for (let i = 0; i + 3 < diffs.length; i++) {
      if (diffs[i] === diffs[i + 1] && diffs[i + 1] === diffs[i + 2] && diffs[i + 2] === diffs[i + 3]) { arith5 = true; break; }
    }
    if (arith5) p += 2;
  }
  const band = {};                                   // 십의자리 구간 4개+ 몰림
  for (const n of s) { const b = Math.floor(n / 10); band[b] = (band[b] || 0) + 1; }
  if (Object.values(band).some(c => c >= 4)) p += 2;
  if (lastWin && lastWin.length) {                   // 직전 회차와 3개+ 겹침
    if (s.filter(n => lastWin.includes(n)).length >= 3) p += 3;
  }
  const isSeq = s.every((n, i) => n === i + 1);       // 유명 패턴
  const allMult5 = s.every(n => n % 5 === 0);
  if (isSeq || allMult5) p += 10;
  return p;
}

// ===== 🆕 v13 결정적 생성 엔진 =====
// 무작위 채움을 전부 없앴다. 모든 전략이 자기 지표만으로 1~45번 전체에 순위를 매기고,
// 그 순위에서 6개를 잘라 쓴다. 같은 데이터(최근 20회)면 몇 번을 눌러도 결과가 같다.
//   줄1 = 1~6위 / 줄2 = 1~3위 + 7~9위 / 줄3 = 1~3위 + 10~12위 …
// 합계·구간 같은 기존 isValid 필터는 "참고 배지"로만 보여주고 재추첨은 하지 않는다.

// 다중 키 비교: [a,b,c] 순으로 오름차순
function cmpKey(a, b) {
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i];
  return 0;
}

// 씨앗 고정 난수 (분배회피 후보 생성 전용 — 같은 회차면 같은 후보군이 나온다)
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 분배회피 후보 조합: 씨앗 고정으로 만든 풀을 대중성 점수 오름차순 정렬.
// 동점은 풀에 들어온 순서(=씨앗 고정 순서)를 그대로 유지하므로 결과가 항상 같다.
const ANTI_POOL = 8000;
function antiPopularCombos(eng, cfg) {
  const rnd = mulberry32(eng.lastRound * 7919 + 13);
  const pool = [];
  const seen = new Set();
  let attempts = 0;
  while (pool.length < ANTI_POOL && attempts < ANTI_POOL * 40) {
    attempts++;
    const set = new Set();
    while (set.size < 6) set.add(Math.floor(rnd() * 45) + 1);
    const arr = [...set].sort((a, b) => a - b);
    const key = arr.join(',');
    if (seen.has(key)) continue;
    seen.add(key);
    // 합 120~175 는 분배회피 자체의 논리(분배 최소 구간 확보)라 후보 단계에서만 쓴다
    if (isValid(arr, 120, 175)) pool.push(arr);
  }
  const scored = pool.map(a => ({ a, sc: popularityScore(a, cfg.lastWin) }));
  scored.sort((x, y) => x.sc - y.sc);   // 안정 정렬 → 동점은 생성 순서 유지
  return scored;
}

// ── 기본 7전략의 1~45 순위표 ───────────────────────────────────────────
// 각 항목: { n, reason }  (배열 순서가 곧 순위)
function rankBase(stratKey, eng, S, ANTI) {
  const ALL = Array.from({ length: 45 }, (_, i) => i + 1);
  const fixed = new Set((S[stratKey] && S[stratKey].fixed) || []);
  const F = n => (fixed.has(n) ? 0 : 1);      // 고정번호 후보가 언제나 최상위
  const cap = v => Math.min(v, eng.rounds);   // 999(미출현)를 창 길이로 눌러 동률 처리
  let rows;

  switch (stratKey) {
    // 🎯 보너스추적: 최근 보너스 → 보너스로 나온 지 가까운 순
    case 'X':
      rows = ALL.map(n => {
        const seen = eng.bonusSeen[n], cnt = eng.bonusCount[n];
        return {
          n, key: [F(n), seen, -cnt, -eng.freq[n], n],
          reason: seen < 999
            ? `보너스 ${seen === 0 ? '직전회차' : seen + '회전'} 출현${cnt > 1 ? ` (총 ${cnt}회)` : ''}`
            : `${eng.rounds}회 내 보너스 없음`
        };
      });
      break;

    // 🚀 미출현폭탄: 안 나온 기간이 긴 순
    case 'Y':
      rows = ALL.map(n => {
        const ls = eng.lastSeen[n];
        return {
          n, key: [F(n), -cap(ls), eng.freq[n], n],
          reason: ls >= 999 ? `${eng.rounds}회 연속 미출현` : `${ls}회째 안 나옴 (총 ${eng.freq[n]}회)`
        };
      });
      break;

    // 🔄 휴식회귀: 자주 나왔는데 오래 쉰 번호 (빈도 × 휴식길이)
    case 'Z':
      rows = ALL.map(n => {
        const ls = cap(eng.lastSeen[n]), fq = eng.freq[n], sc = fq * ls;
        return {
          n, key: [F(n), -sc, -fq, -ls, n],
          reason: fq === 0 ? `${eng.rounds}회 미출현 (휴식점수 0)` : `${fq}회 출현 · ${ls}회째 휴식 (점수 ${sc})`
        };
      });
      break;

    // 🔁 이월수: 직전 회차 6개 → 이월(연속 출현) 이력 많은 순
    case 'W':
      rows = ALL.map(n => {
        const cc = eng.carryCount[n], ls = eng.lastSeen[n];
        return {
          n, key: [F(n), -cc, cap(ls), n],
          reason: fixed.has(n)
            ? `직전 ${eng.lastRound}회 당첨번호`
            : (cc > 0 ? `이월 ${cc}회 · ${ls}회전 출현` : (ls >= 999 ? `${eng.rounds}회 미출현` : `이월 이력 없음 · ${ls}회전 출현`))
        };
      });
      break;

    // ✨ 최약끝수: 약한 끝수에 속한 번호 순
    case 'V':
      rows = ALL.map(n => {
        const d = n % 10, dr = eng.digitRank[d];
        return {
          n, key: [dr, eng.freq[n], -cap(eng.lastSeen[n]), n],
          reason: `끝수${d} (약한 순 ${dr + 1}위 · 끝수 총 ${eng.digitCount[d]}회)`
        };
      });
      break;

    // 🎲 합계정밀: 목표 합을 6칸으로 나눈 "이상적 사다리"에 가까운 순.
    //    같은 거리끼리는 저→고 슬롯을 골고루 훑도록 순서를 섞어, 어느 6칸을 잘라도
    //    합이 목표 근처에 오게 만든다.
    case 'U': {
      const mu = eng.avgSum / 6, SP = 6.5;
      const slots = [0, 1, 2, 3, 4, 5].map(i =>
        Math.round(Math.min(45, Math.max(1, mu + (i - 2.5) * SP))));
      const SEQ = [0, 3, 5, 1, 4, 2];   // 앞 3개(슬롯 0·3·5)의 합이 목표합의 절반이 되도록
      rows = ALL.map(n => {
        let best = 0, bd = Infinity;
        slots.forEach((v, i) => { const d = Math.abs(n - v); if (d < bd) { bd = d; best = i; } });
        const side = n < slots[best] ? 0 : 1;
        return {
          n, key: [bd, side, SEQ.indexOf(best), n],
          reason: `목표합 ${eng.avgSum} · ${slots[best]} 자리${bd === 0 ? ' 정확히 일치' : ` (차이 ${bd})`}`
        };
      });
      break;
    }

    // 🤫 분배회피: 대중성 점수가 낮은 상위 조합들에 얼마나 자주 들어가는지 순
    case 'T': {
      const top = ANTI.slice(0, Math.max(1, Math.floor(ANTI.length * 0.05)));
      const cnt = {};
      ALL.forEach(n => { cnt[n] = 0; });
      for (const c of top) for (const n of c.a) cnt[n]++;
      rows = ALL.map(n => ({
        n, key: [-cnt[n], n],
        reason: `덜 대중적인 조합 ${top.length}개 중 ${cnt[n]}회 등장 (${(cnt[n] / top.length * 100).toFixed(0)}%)`
      }));
      break;
    }

    default:
      rows = ALL.map(n => ({ n, key: [n], reason: '' }));
  }

  rows.sort((a, b) => cmpKey(a.key, b.key));
  return rows.map((r, i) => ({ n: r.n, rank: i + 1, reason: r.reason, fixed: fixed.has(r.n) }));
}

// ── 합의(C)·동순위(R): 기본 7전략의 순위표를 재료로 쓰는 메타 전략 ────────
function rankMeta(kind, base) {
  const ALL = Array.from({ length: 45 }, (_, i) => i + 1);
  const pos = {};                       // pos[strat][n] = 그 전략에서의 순위
  for (const s of BASE_STRATS) {
    pos[s] = {};
    base[s].forEach(r => { pos[s][r.n] = r.rank; });
  }
  const rows = ALL.map(n => {
    const ranks = BASE_STRATS.map(s => pos[s][n]);
    const sum = ranks.reduce((a, c) => a + c, 0);
    const avg = sum / ranks.length;

    if (kind === 'C') {
      // 7전략 TOP3 에 몇 번 들었나 → 그다음 평균 순위
      const hit = ranks.filter(r => r <= 3).length;
      return {
        n, key: [-hit, avg, n],
        reason: hit > 0 ? `${hit}개 전략 TOP3 (평균 ${avg.toFixed(1)}위)` : `TOP3 없음 · 평균 ${avg.toFixed(1)}위`
      };
    }
    // R: 2개 이상 전략이 똑같은 순위를 매긴 번호 우선 → 그 순위가 좋은 순
    // 순위가 높든 낮든 "여러 전략이 똑같이 봤다"는 사실 자체를 신호로 본다 (45위끼리 겹쳐도 인정)
    const tally = {};
    ranks.forEach(r => { tally[r] = (tally[r] || 0) + 1; });
    let bestCnt = 0, bestRank = 999;
    for (const k of Object.keys(tally)) {
      const c = tally[k], r = Number(k);
      if (c >= 2 && (c > bestCnt || (c === bestCnt && r < bestRank))) { bestCnt = c; bestRank = r; }
    }
    return {
      n, key: [-bestCnt, bestRank, sum, n],
      reason: bestCnt >= 2 ? `${bestCnt}개 전략이 나란히 ${bestRank}위` : `동순위 없음 · 순위합 ${sum}`
    };
  });
  rows.sort((a, b) => cmpKey(a.key, b.key));
  return rows.map((r, i) => ({ n: r.n, rank: i + 1, reason: r.reason, fixed: false }));
}

// 전체 순위표 한 번에 만들기 (engine 이 바뀔 때만 재계산)
function buildRankings(eng, S) {
  const ANTI = antiPopularCombos(eng, S.T);
  const R = {};
  for (const k of BASE_STRATS) R[k] = rankBase(k, eng, S, ANTI);
  R.C = rankMeta('C', R);
  R.R = rankMeta('R', R);
  return { ranks: R, anti: ANTI };
}

// ── 순위 → 실제 한 줄 ──────────────────────────────────────────────────
// 줄1 = 1~6위, 줄k(k≥2) = 1~3위 + (3k+1 ~ 3k+3)위
function pickByRank(ranked, lineIdx) {
  const out = [];
  const push = r => { if (r && !out.some(o => o.n === r.n)) out.push(r); };
  if (lineIdx <= 1) {
    for (let i = 0; i < 6; i++) push(ranked[i]);
    return out;
  }
  for (let i = 0; i < 3; i++) push(ranked[i]);
  const start = 3 * lineIdx;                    // 3k+1위의 0-based 위치
  for (let i = 0; out.length < 6 && i < 45; i++) push(ranked[(start + i) % 45]);
  return out;
}

// 한 줄이 "왜 이 번호인지" 요약
function lineReason(picked) {
  const head = picked.slice(0, 3).map(p => `${p.n}번(${p.rank}위) ${p.reason}`).join(' · ');
  return picked.length > 3 ? `${head} … 외 ${picked.length - 3}개` : head;
}

function buildLine(stratKey, lineIdx, RANKS, ANTI) {
  // 분배회피는 번호 단위가 아니라 조합 단위로 고른다 — lineIdx 번째로 덜 대중적인 조합
  if (stratKey === 'T') {
    if (!ANTI.length) return null;
    const pick = ANTI[Math.min(lineIdx - 1, ANTI.length - 1)];
    return {
      numbers: [...pick.a],
      reason: `대중성 점수 ${pick.sc}점 · 후보 ${ANTI.length.toLocaleString()}개 중 ${Math.min(lineIdx, ANTI.length)}번째로 낮음 (낮을수록 당첨 시 덜 나눔)`
    };
  }
  const ranked = RANKS[stratKey];
  if (!ranked) return null;
  const picked = pickByRank(ranked, lineIdx);
  if (picked.length < 6) return null;
  return { numbers: picked.map(p => p.n).sort((a, b) => a - b), reason: lineReason(picked) };
}

// nextIdx: 전략별 "다음 줄 번호"(1부터). 이미 저장된 줄 수를 이어받아 순위를 계속 내려간다.
function generateBatch(strategy, count, RANKS, ANTI, nextIdx, mixStart) {
  const result = [];
  const idx = Object.assign({}, nextIdx);
  for (let i = 0; i < count; i++) {
    const s = strategy === 'MIX'
      ? DISPLAY_ORDER[((mixStart || 0) + i) % DISPLAY_ORDER.length]
      : strategy;
    const line = buildLine(s, idx[s] || 1, RANKS, ANTI);
    if (!line) continue;
    idx[s] = (idx[s] || 1) + 1;
    result.push(Object.assign({ strategy: s }, line));
  }
  return result;
}

function generateBacktest30(RANKS, ANTI) {
  const games = [];
  let id = 1;
  for (const strat of Object.keys(BACKTEST_DIST)) {
    for (let i = 0; i < BACKTEST_DIST[strat]; i++) {
      const line = buildLine(strat, i + 1, RANKS, ANTI);
      if (line) games.push(Object.assign({ id: id++, strategy: strat }, line));
    }
  }
  return games;
}

// ── 참고 배지용 검사 (강제하지 않고 결과만 보여준다) ──────────────────
function lineChecks(nums) {
  const s = [...nums].sort((a, b) => a - b);
  const sum = s.reduce((a, b) => a + b, 0);
  const low = s.filter(n => n <= 15).length;
  const mid = s.filter(n => n >= 16 && n <= 30).length;
  const high = s.filter(n => n >= 31).length;
  const odd = s.filter(n => n % 2 === 1).length;
  let pairs = 0;
  for (let i = 0; i < 5; i++) if (s[i + 1] - s[i] === 1) pairs++;
  const items = [
    { label: `합 ${sum}`, ok: sum >= 110 && sum <= 160 },
    { label: `저중고 ${low}·${mid}·${high}`, ok: low > 0 && mid > 0 && high > 0 },
    { label: `홀 ${odd}`, ok: odd >= 2 && odd <= 4 },
    { label: `연번 ${pairs}`, ok: pairs <= 1 },
  ];
  return { sum, items, passed: items.filter(i => i.ok).length };
}

function calculatePrize(numbers, winNums, bonus) {
  const matches = numbers.filter(n => winNums.includes(n)).length;
  const hasBonus = numbers.includes(bonus);
  if (matches === 6) return { tier: 1, amount: 2000000000, label: '1등' };
  if (matches === 5 && hasBonus) return { tier: 2, amount: 50000000, label: '2등' };
  if (matches === 5) return { tier: 3, amount: 1500000, label: '3등' };
  if (matches === 4) return { tier: 4, amount: 50000, label: '4등' };
  if (matches === 3) return { tier: 5, amount: 5000, label: '5등' };
  return { tier: 0, amount: 0, label: '낙첨' };
}

// ===== 📊 공통 계산 · freqTable(회차) =====
// 그 회차에 저장된 줄 전체에서 번호별 등장 횟수를 세고 공동순위(1·2·2·4 방식) 순위표를 만든다.
// 화면1(추첨 전)·화면2(매칭 후)·화면3(역대 프로필)이 전부 이 함수 하나만 쓴다. 서버 불필요.
function freqTable(rec) {
  const games = (rec && Array.isArray(rec.games)) ? rec.games : [];
  const count = {}, byStrat = {};
  for (let n = 1; n <= 45; n++) { count[n] = 0; byStrat[n] = {}; }
  for (const g of games) {
    if (!g || !Array.isArray(g.numbers)) continue;
    for (const n of g.numbers) {
      if (!(n >= 1 && n <= 45)) continue;
      count[n]++;
      byStrat[n][g.strategy] = (byStrat[n][g.strategy] || 0) + 1;
    }
  }
  const rows = [];
  for (let n = 1; n <= 45; n++) rows.push({ n, count: count[n], strats: byStrat[n] });
  // 횟수 내림차순 → 번호 오름차순. 같은 횟수는 같은 순위(공동순위)
  rows.sort((a, b) => b.count - a.count || a.n - b.n);
  rows.forEach((row, i) => {
    row.rank = (i > 0 && rows[i - 1].count === row.count) ? rows[i - 1].rank : i + 1;
    // 어느 전략이 이 번호를 넣었는지 (많이 넣은 전략 순)
    row.stratList = Object.keys(row.strats)
      .map(k => [k, row.strats[k]])
      .sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
  });
  const byNum = {};
  for (const row of rows) byNum[row.n] = row;
  return {
    rows, byNum,
    lines: games.length,
    top7: rows.slice(0, 7).map(x => x.n),           // 표시상의 상위 7칸 (동률이어도 7개로 자름)
    missing: rows.filter(x => x.count === 0).map(x => x.n).sort((a, b) => a - b)
  };
}

// 당첨번호가 "내 빈도 순위표"에서 몇 위였는지 (화면2·화면3 공용). 매칭 전이면 null
function winProfile(rec, ft) {
  if (!rec || !Array.isArray(rec.winNumbers) || rec.winNumbers.length !== 6) return null;
  if (!ft || ft.lines === 0) return null;
  const top7 = ft.top7;
  const mk = (n) => {
    const row = ft.byNum[n];
    if (!row) return null;
    return { n, rank: row.rank, count: row.count, top7: top7.indexOf(n) >= 0, missing: row.count === 0 };
  };
  const win = [...rec.winNumbers].sort((a, b) => a - b).map(mk).filter(Boolean);
  if (win.length !== 6) return null;
  const bonus = (rec.bonus >= 1 && rec.bonus <= 45) ? mk(rec.bonus) : null;
  return {
    win, bonus,
    ranksAsc: win.map(w => w.rank).sort((a, b) => a - b),
    avgRank: win.reduce((s, w) => s + w.rank, 0) / 6,
    top7Hits: win.filter(w => w.top7).length,
    missing: win.filter(w => w.missing).map(w => w.n)
  };
}

// TOP7 7칸이 우연히 당첨번호와 겹칠 기대 개수 = 7 × 6/45
const TOP7_EXPECT = 7 * 6 / 45;

// 9전략에 속하지 않는 보조 줄 (통계의 전략별 ROI 집계에는 넣지 않는다)
const EXTRA_STRAT = {
  F: { name: '커버보완', emoji: '➕' },
  P: { name: '병렬조합', emoji: '🔗' }
};
const stratMeta = (k) => STRAT_META[k] || EXTRA_STRAT[k] || {};

// ➕ 커버 보완: 아직 한 번도 안 쓴 번호를 우선 담아 줄을 만든다 (무작위 없음 · 언제 눌러도 같은 결과)
// 남은 자리는 "가장 적게 실은 번호"로 채우되, 참고 배지(lineChecks)를 가장 많이 통과하는 조합을 고른다.
function buildCoverLines(ft, maxLines) {
  const missing = ft.missing.slice();
  if (missing.length === 0 || maxLines <= 0) return [];
  const filler = ft.rows.filter(x => x.count > 0).slice().reverse().map(x => x.n); // 적게 실은 번호부터
  const need = Math.min(maxLines, Math.ceil(missing.length / 6));
  const lines = [];
  const usedFill = {};
  for (let i = 0; i < need; i++) {
    const base = missing.slice(i * 6, i * 6 + 6);
    if (base.length === 0) break;
    const want = 6 - base.length;
    let best = null;
    if (want === 0) {
      best = { nums: base.slice().sort((a, b) => a - b), fill: [], passed: lineChecks(base).passed };
    } else {
      for (let off = 0; off + want <= filler.length; off++) {
        const fill = [];
        for (let j = off; j < filler.length && fill.length < want; j++) {
          const n = filler[j];
          if (base.indexOf(n) >= 0 || usedFill[n]) continue;
          fill.push(n);
        }
        if (fill.length < want) break;
        const nums = base.concat(fill).sort((a, b) => a - b);
        const passed = lineChecks(nums).passed;
        if (!best || passed > best.passed) best = { nums, fill, passed };
        if (passed === 4) break;
      }
    }
    if (!best) break;
    best.fill.forEach(n => { usedFill[n] = true; });
    lines.push({
      strategy: 'F',
      numbers: best.nums,
      reason: `커버 보완 · 미포함 ${base.join('·')}번 우선 + 가장 적게 실은 번호로 채움 (참고 배지 ${best.passed}/4 통과)`
    });
  }
  return lines;
}

// ===== 🧪 모의 실험 (가상 게임 · 실구매와 완전 분리) =====
// 규칙 "순위 자리 매칭":
//   ① 직전 매칭 완료 회차의 당첨번호 6개가 "그 회차 내 저장 줄들의 빈도표"에서 몇 위였는지 세어
//      순위 프로필을 자동 계산한다.  예) 1236회 → [6, 15, 26, 26, 43, 43위]
//   ② 이번 회차 빈도표에서 "같은 순위 자리에 있는 번호 그룹"을 찾아 필요한 개수만큼 조합한다.
//      (빈도표는 공동순위라 한 순위에 여러 번호가 묶인다. 26위 자리 2개 = 26위 그룹에서 2개 뽑기)
//      같은 순위가 없으면 가장 가까운 순위 그룹으로 대체하고 "대체됨"으로 표시한다.
//   ③ 모든 조합을 가상 게임으로 만든다. 3,000개를 넘으면 무작위 3,000개만 샘플링한다.
//   ※ 프로필은 기본이 자동(직전 회차에서 계산)이고, 설정에서 수동 입력으로 고정할 수도 있다.
// ⚠️ 여기서 만든 게임은 rec.mock 에만 들어가고 rec.games / rec.matches 는 건드리지 않는다.
//    통계 탭 손익은 games·matches 만 보므로 모의 실험은 손익에 절대 섞이지 않는다.
const MOCK_MAX = 3000;                             // 이 개수를 넘으면 경고 후 무작위 샘플링
const MOCK_P3 = 194130 / 8145060;                  // 무작위 한 줄이 3개 이상 맞을 확률 ≈ 2.38%
const MOCK_MODE_KEY = 'settings:mockMode';         // 'auto' | 'manual'
const MOCK_RANKS_KEY = 'settings:mockRanks';       // 수동 고정 순위 프로필

// "6,15,26,26,43,43" 같은 입력 → 순위 6개 배열(오름차순). 형식이 틀리면 null
function parseRankProfile(str) {
  const parts = String(str || '').split(/[^0-9]+/).filter(s => s.length > 0).map(Number);
  if (parts.length !== 6) return null;
  if (parts.some(n => !isFinite(n) || n < 1 || n > 45)) return null;
  return parts.sort((a, b) => a - b);
}

function nCk(n, k) {
  if (k < 0 || k > n || n < 0) return 0;
  k = Math.min(k, n - k);
  let r = 1;
  for (let i = 1; i <= k; i++) r = r * (n - k + i) / i;
  return Math.round(r);
}

// pool 에서 k개를 뽑는 조합 중 idx 번째(사전순)를 바로 계산한다 (전부 만들지 않아 폰에서도 안 멈춤)
function comboAt(pool, k, idx) {
  const res = [];
  const n = pool.length;
  let start = 0;
  for (let i = 0; i < k; i++) {
    for (let j = start; j < n; j++) {
      const c = nCk(n - j - 1, k - i - 1);
      if (idx < c) { res.push(pool[j]); start = j + 1; break; }
      idx -= c;
    }
  }
  return res;
}

// 모의 실험에 쓸 두 회차 — 대상(이번 회차) / 프로필 출처(직전 매칭 완료 회차)
function pickMockRounds(saved) {
  const usable = (saved || []).filter(r =>
    r && !r.backtest && !r.recordOnly && Array.isArray(r.games) && r.games.length > 0);
  const byDesc = (a, b) => b.round - a.round;
  const open = usable.filter(r => !r.matches).sort(byDesc);
  const target = open[0] || usable.slice().sort(byDesc)[0] || null;
  const matched = usable.filter(r =>
    r.matches && Array.isArray(r.winNumbers) && r.winNumbers.length === 6).sort(byDesc);
  const prev = target ? (matched.filter(r => r.round < target.round)[0] || null) : null;
  return { target, prev };
}

// 직전 회차 당첨번호 6개의 "내 빈도표 순위" = 순위 프로필 (자동 계산)
function rankProfileOf(rec) {
  if (!rec || !Array.isArray(rec.winNumbers) || rec.winNumbers.length !== 6) return null;
  const ft = freqTable(rec);
  if (ft.lines === 0) return null;
  const ranks = rec.winNumbers.map(n => (ft.byNum[n] ? ft.byNum[n].rank : null));
  if (ranks.some(r => !r)) return null;
  return {
    round: rec.round, lines: ft.lines,
    ranks: ranks.slice().sort((a, b) => a - b),
    detail: rec.winNumbers.map(n => ({ n, rank: ft.byNum[n].rank, count: ft.byNum[n].count }))
      .sort((a, b) => a.rank - b.rank)
  };
}

// 순위 프로필 → "어느 순위 그룹에서 몇 개를 뽑을지" 설계도
function buildMockPlan(profileRanks, curRec) {
  if (!curRec) return null;
  const profile = (Array.isArray(profileRanks) && profileRanks.length === 6)
    ? profileRanks.slice().sort((a, b) => a - b) : null;
  if (!profile) return null;

  const cf = freqTable(curRec);
  if (cf.lines === 0) return null;
  // 빈도표는 공동순위(1·2·2·4…) — 같은 순위에 묶인 번호들이 한 그룹이다
  const byRank = {};
  cf.rows.forEach(r => { (byRank[r.rank] = byRank[r.rank] || []).push(r.n); });
  const avail = Object.keys(byRank).map(Number).sort((a, b) => a - b);
  if (avail.length === 0) return null;

  // 프로필의 각 순위 → 실제 존재하는 순위로 (같은 순위 없으면 가장 가까운 순위, 동률이면 위쪽 순위)
  const need = {}, from = {};
  for (const pr of profile) {
    let best = avail[0];
    for (const a of avail) {
      const d = Math.abs(a - pr), bd = Math.abs(best - pr);
      if (d < bd || (d === bd && a < best)) best = a;
    }
    need[best] = (need[best] || 0) + 1;
    (from[best] = from[best] || []).push(pr);
  }

  const rows = avail.filter(rk => need[rk]).map(rk => ({
    rank: rk, pool: byRank[rk].slice(), want: need[rk],
    take: Math.min(need[rk], byRank[rk].length), from: from[rk].slice(),
    count: cf.byNum[byRank[rk][0]].count
  }));
  // 그룹 크기보다 많이 필요한 자리는 가장 가까운 순위의 여유 그룹에서 채운다
  const shortQ = [];
  rows.forEach(g => { for (let i = g.pool.length; i < g.want; i++) shortQ.push(g.from[i]); });
  for (const pr of shortQ) {
    const room = rows.filter(g => g.take < g.pool.length);
    if (room.length === 0) break;
    room.sort((a, b) => Math.abs(a.rank - pr) - Math.abs(b.rank - pr) || a.rank - b.rank);
    room[0].take++;
    room[0].filled = (room[0].filled || 0) + 1;
  }
  if (rows.reduce((s, g) => s + g.take, 0) !== 6) return null;

  let total = 1;
  rows.forEach(g => { g.ways = nCk(g.pool.length, g.take); total *= g.ways; });
  rows.forEach(g => { g.subs = g.from.filter(r => r !== g.rank); });   // 대체된 프로필 순위들
  const poolNums = rows.reduce((a, g) => a.concat(g.pool), []).sort((a, b) => a - b);
  const fixed = rows.filter(g => g.take === g.pool.length)
    .reduce((a, g) => a.concat(g.pool), []).sort((a, b) => a - b);
  return {
    round: curRec.round, srcLines: curRec.games.length,
    profile, groups: rows, total, poolNums, fixed,
    substituted: rows.some(g => g.subs.length > 0) || rows.some(g => g.filled)
  };
}

// 설계도 → 실제 가상 게임 목록. 3,000개 초과면 씨앗 고정 난수로 3,000개만 뽑는다(항상 같은 결과).
function buildMockCombos(plan, seedBase) {
  const rows = plan.groups;
  const total = plan.total;
  const decode = (idx) => {
    const nums = [];
    let rest = idx;
    for (let i = rows.length - 1; i >= 0; i--) {
      const g = rows[i];
      const sub = rest % g.ways;
      rest = Math.floor(rest / g.ways);
      const part = comboAt(g.pool, g.take, sub);
      for (const n of part) nums.push(n);
    }
    return nums.sort((a, b) => a - b);
  };
  if (total <= MOCK_MAX) {
    const out = [];
    for (let i = 0; i < total; i++) out.push(decode(i));
    return { combos: out, sampled: false, seed: 0 };
  }
  const seed = (seedBase * 2654435761 + total) >>> 0;
  const rnd = mulberry32(seed);
  const seen = {}, out = [];
  let guard = 0;
  while (out.length < MOCK_MAX && guard < MOCK_MAX * 50) {
    guard++;
    const idx = Math.floor(rnd() * total);
    if (seen[idx]) continue;
    seen[idx] = 1;
    out.push(decode(idx));
  }
  return { combos: out, sampled: true, seed };
}

// 가상 게임 채점 — 실구매 손익과 무관, 적중 개수만 본다
function scoreMock(mock, winNumbers, bonus) {
  if (!mock || !Array.isArray(mock.combos) || mock.combos.length === 0) return null;
  if (!Array.isArray(winNumbers) || winNumbers.length !== 6) return null;
  const win = {};
  winNumbers.forEach(n => { win[n] = 1; });
  const hasB = (bonus >= 1 && bonus <= 45);
  const dist = [0, 0, 0, 0, 0, 0, 0];
  let best = null;
  for (let i = 0; i < mock.combos.length; i++) {
    const c = mock.combos[i];
    let m = 0;
    for (const n of c) if (win[n]) m++;
    dist[m]++;
    const b = hasB && c.indexOf(bonus) >= 0;
    // 같은 적중 수면 보너스를 포함한 줄을 대표로 (5개+보너스가 더 높은 등급)
    if (!best || m > best.hits || (m === best.hits && b && !best.bonus)) {
      best = { idx: i + 1, hits: m, numbers: c, bonus: b };
    }
  }
  const games = mock.combos.length;
  const hit3 = dist[3] + dist[4] + dist[5] + dist[6];
  const expect = games * MOCK_P3;
  const ratio = expect > 0 ? hit3 / expect : 0;
  let verdict, tone;
  if (ratio >= 1.5) { verdict = '기대치 초과 = 이번 주는 운이 좋았음'; tone = 'up'; }
  else if (ratio <= 0.5) { verdict = '기대치 미달 = 프로필이 오히려 방해했음'; tone = 'down'; }
  else { verdict = '기대치와 비슷 = 프로필 반복 안 됨'; tone = 'flat'; }
  if (best) {
    best.label = best.hits === 6 ? '6개 (1등)'
      : (best.hits === 5 && best.bonus) ? '5개 + 보너스 (2등)'
      : `${best.hits}개${best.bonus ? ' + 보너스' : ''}`;
  }
  return { games, dist, hit3, expect, ratio, best, verdict, tone };
}

// ===== 📊 [C] 분석 리더보드 — 12개 축 =====
// 9전략(v13 선호순위) + 내 빈도순위 + 핫넘버 + 콜드넘버.
// ⚠️ 각 회차는 "그 회차 직전 데이터"만으로 순위를 만든다 (미래 정보 차단).
const LB_VERSION = 1;   // 축 계산 로직이 바뀌면 올린다 → 캐시 자동 무효화
const LB_RECENT = 10;   // 최근 몇 회를 볼지
const RANDOM_EXPECT_RANK = 23;   // 1~45 무작위 기대 순위 = (1+45)/2

const AXES = [
  { k: 'MY', label: '내 빈도', emoji: '📊' },
  { k: 'HOT', label: '핫넘버', emoji: '🔥' },
  { k: 'COLD', label: '콜드넘버', emoji: '🧊' }
].concat(DISPLAY_ORDER.map(k => ({ k, label: STRAT_META[k].name, emoji: STRAT_META[k].emoji })));

// 공동순위 순위표 만들기 (keyFn 은 번호를 뺀 정렬키 배열을 돌려준다)
function rankByKey(keyFn) {
  const rows = [];
  for (let n = 1; n <= 45; n++) rows.push({ n, key: keyFn(n) });
  rows.sort((a, b) => cmpKey(a.key.concat([a.n]), b.key.concat([b.n])));
  const m = {};
  rows.forEach((r, i) => {
    m[r.n] = (i > 0 && cmpKey(rows[i - 1].key, r.key) === 0) ? m[rows[i - 1].n] : i + 1;
  });
  return m;
}

// 한 회차 = 12축 × (당첨 6개 + 보너스) 순위
function buildLeaderRow(rec, priorHist) {
  const eng = computeEngine(priorHist);
  const S = buildStrategies(eng);
  const built = buildRankings(eng, S);
  const axes = {};
  for (const k of Object.keys(built.ranks)) {
    const m = {};
    built.ranks[k].forEach(r => { m[r.n] = r.rank; });
    axes[k] = m;
  }
  axes.HOT = rankByKey(n => [-eng.freq[n]]);                              // 많이 나온 순
  axes.COLD = rankByKey(n => [-Math.min(eng.lastSeen[n], eng.rounds)]);   // 오래 안 나온 순
  const ft = freqTable(rec);
  if (ft.lines > 0) {
    const m = {};
    ft.rows.forEach(r => { m[r.n] = r.rank; });
    axes.MY = m;
  } else axes.MY = null;

  const nums = [...rec.winNumbers].sort((a, b) => a - b);
  const all = nums.concat([rec.bonus]);
  const cells = {};
  for (const a of AXES) {
    const m = axes[a.k];
    cells[a.k] = m ? all.map(n => m[n] || null) : null;
  }
  return { round: rec.round, nums, bonus: rec.bonus, base: eng.baseRange, lines: ft.lines, cells };
}

// 순위 → 색 (상위=파랑 / 하위=빨강)
function rankColor(rank, dark) {
  if (!rank) return {};
  const t = Math.min(1, Math.max(0, (rank - 1) / 44));
  const hue = 220 - 220 * t;
  return dark
    ? { backgroundColor: `hsl(${hue}, 50%, 27%)`, color: '#e2e8f0' }
    : { backgroundColor: `hsl(${hue}, 85%, 92%)`, color: `hsl(${hue}, 75%, 28%)` };
}

// ===== 🔗 병렬 조합 (12축 TOP2 × 3축 = 6개) =====
// 규칙: 각 축의 순위표에서 TOP2 를 가져와 2+2+2 로 한 줄을 만든다.
//   · 앞 축이 이미 쓴 번호와 겹치면 그 축의 다음 순위 번호로 대체한다 (항상 6개 유지, * 로 표시)
//   · 축 순서는 AXES 의 고정 순서를 따르므로 같은 데이터면 몇 번을 눌러도 결과가 같다
//   · 합계·저중고 같은 유효성은 참고 배지로만 보여주고 재생성하지 않는다
const PAR_VERSION = 1;                 // 계산 로직이 바뀌면 올린다 → 백테스트 캐시 자동 무효화
const PAR_SOLO_LINES = 5;              // 비교용 "단일 전략 줄" = 9전략 × 5줄 = 45줄
const AXIS_SHORT = {
  MY: '내빈도', HOT: '핫', COLD: '콜드',
  T: '분배', C: '합의', R: '동순위', X: '보너스', Y: '미출현',
  Z: '휴식', W: '이월', V: '끝수', U: '합계'
};
const axisShort = (k) => AXIS_SHORT[k] || k;
const axisMeta = (k) => AXES.find(a => a.k === k) || { k, label: k, emoji: '' };

// 12축 각각의 1~45 순위 순서 (배열 순서가 곧 순위). 재료가 없는 축은 null
function axisOrders(eng, RANKS, ft) {
  const ALL = Array.from({ length: 45 }, (_, i) => i + 1);
  const ord = {};
  for (const k of Object.keys(RANKS)) ord[k] = RANKS[k].map(r => r.n);
  ord.HOT = ALL.slice().sort((a, b) => eng.freq[b] - eng.freq[a] || a - b);
  ord.COLD = ALL.slice().sort((a, b) =>
    Math.min(eng.lastSeen[b], eng.rounds) - Math.min(eng.lastSeen[a], eng.rounds) || a - b);
  // 📊 내 빈도 = 그 회차에 저장된 줄들의 빈도표. 줄이 하나도 없으면 이 축은 못 쓴다
  ord.MY = (ft && ft.lines > 0) ? ft.rows.map(r => r.n) : null;
  return ord;
}

// 쓸 수 있는 축 키 목록 (AXES 고정 순서 유지)
function axisKeys(ord) {
  return AXES.map(a => a.k).filter(k => Array.isArray(ord[k]) && ord[k].length === 45);
}

// ===== 🆕 v18 · 병렬 방식 3종 =====
// 한 줄은 언제나 6개다. 축을 몇 개 쓰고 축마다 몇 개를 뽑을지만 다르다.
//   축 3개 × 2개 = 6  (기존 · 그대로 둔다)
//   축 2개 × 3개 = 6  (신설)
//   축 1개 × 6개 = 6  (신설 — 한 축이 혼자 6개를 다 채운다)
// ★ 세 방식은 줄 수가 크게 다르다(11축 기준 165 / 55 / 11). 적중을 비교할 때는
//   같은 줄 수로 잘라서 봐야 공정하다 — parEqualN·gradePoolTop 참조.
const PAR_MODES = [
  { key: 'a3x2', m: 3, per: 2, label: '축 3개 × 2개', short: '3×2' },
  { key: 'b2x3', m: 2, per: 3, label: '축 2개 × 3개', short: '2×3' },
  { key: 'c1x6', m: 1, per: 6, label: '축 1개 × 6개', short: '1×6' },
];
const PAR_MODE_DEFAULT = 'a3x2';                       // 기존 동작을 기본값으로 유지
const parMode = (key) => PAR_MODES.find(x => x.key === key) || PAR_MODES[0];

// ※ nCk 는 이미 위(955행 부근)에 있다 — 여기서 다시 만들면 **기존 정의를 덮어쓴다**(함수 선언 호이스팅).
//   줄 수 표기는 그 함수를 그대로 쓴다.

// 축 묶음 → 한 줄. 축마다 per 개씩. 겹치면 다음 순위로 밀어 항상 6개를 채운다
function parallelLine(group, ord, per) {
  per = per || 2;
  const used = [], parts = [];
  for (const k of group) {
    const list = ord[k];
    if (!list) return null;
    const nums = [], subs = [];
    for (let i = 0; i < list.length && nums.length < per; i++) {
      const n = list[i];
      if (used.indexOf(n) >= 0) continue;
      nums.push(n);
      if (i >= per) subs.push(n);            // TOP(per) 자리를 벗어나 끌어온 번호
    }
    if (nums.length < per) return null;
    nums.forEach(n => used.push(n));
    parts.push({ k, nums, subs });
  }
  if (used.length !== 6) return null;
  const label = parts.map(p =>
    `${axisShort(p.k)}(${p.nums.map(n => n + (p.subs.indexOf(n) >= 0 ? '*' : '')).join(',')})`
  ).join('+');
  return {
    numbers: used.slice().sort((a, b) => a - b),
    axes: group.slice(),
    parts, label,
    substituted: parts.some(p => p.subs.length > 0)
  };
}

// 축 m 개 조합 전체 = C(축수, m) 줄.
// 축 순서는 AXES 고정 순서를 따르므로 같은 데이터면 몇 번을 눌러도 결과가 같다.
function parallelCombos(ord, keys, m, per) {
  const out = [];
  const pick = (start, acc) => {
    if (acc.length === m) {
      const line = parallelLine(acc, ord, per);
      if (line) out.push(line);
      return;
    }
    for (let i = start; i < keys.length; i++) pick(i + 1, acc.concat([keys[i]]));
  };
  pick(0, []);
  return out;
}

// 기존 호출부 호환 — 축 3개 × 2개(= 종전 동작) 그대로
function parallelAll(ord, keys) {
  return parallelCombos(ord, keys, 3, 2);
}

// ===== 🆕 v19 · 여러 방식을 겹쳐 쓰기 =====
// 방식을 한 개만 고르는 게 아니라 여러 개를 함께 켤 수 있다.
//   · 켠 방식들의 줄을 **PAR_MODES 순서대로** 이어 붙인다(순서가 고정이라 결과가 매번 같다)
//   · 방식이 달라도 번호 6개가 똑같은 줄이 나올 수 있다 → **먼저 나온 것만 남긴다**
//     (같은 줄을 두 번 사는 셈이 되면 안 된다)
function parallelUnion(ord, keys, modeKeys) {
  const picked = PAR_MODES.filter(md => (modeKeys || []).indexOf(md.key) >= 0);
  const out = [], seen = {};
  let dup = 0;
  picked.forEach(md => {
    parallelCombos(ord, keys, md.m, md.per).forEach(line => {
      const sig = line.numbers.join(',');
      if (seen[sig]) { dup++; return; }
      seen[sig] = 1;
      out.push(Object.assign({}, line, { mode: md.key, modeShort: md.short }));
    });
  });
  out.dupSkipped = dup;
  return out;
}

// 켠 방식들의 줄 수 합(중복 제거 전). 화면에 대략을 적기 위한 것
function parUnionCount(keys, modeKeys) {
  return PAR_MODES
    .filter(md => (modeKeys || []).indexOf(md.key) >= 0)
    .reduce((a, md) => a + nCk(keys.length, md.m), 0);
}

// 세 방식을 공정하게 비교할 때 쓰는 '같은 줄 수'.
// 가장 적게 나오는 방식(축 1개 = 축 수만큼)에 맞춘다.
function parEqualN(keys) {
  const counts = PAR_MODES.map(md => nCk(keys.length, md.m)).filter(v => v > 0);
  return counts.length ? Math.min.apply(null, counts) : 0;
}

// 앞에서 N줄만 잘라 채점 — 자르는 기준은 축 고정 순서라 매번 같다
function gradePoolTop(combos, n, winNumbers, bonus) {
  return gradePool((n > 0 ? combos.slice(0, n) : combos), winNumbers, bonus);
}

// 한 회차에서 세 방식을 나란히 채점한다.
//   full  = 그 방식이 만드는 전체 줄
//   equal = 세 방식을 같은 줄 수로 잘라낸 것 (공정 비교용)
function parCompareModes(ord, keys, winNumbers, bonus) {
  const n = parEqualN(keys);
  const rows = PAR_MODES.map(md => {
    const lines = parallelCombos(ord, keys, md.m, md.per).map(l => l.numbers);
    return {
      key: md.key, label: md.label, short: md.short, m: md.m, per: md.per,
      lines: lines.length,
      full: gradePool(lines, winNumbers, bonus),
      equal: gradePoolTop(lines, n, winNumbers, bonus),
    };
  });
  /* 🆕 v19 — 셋을 다 켰을 때(중복 제거 후)도 함께 낸다 */
  const all = parallelUnion(ord, keys, PAR_MODES.map(m => m.key)).map(l => l.numbers);
  rows.push({
    key: 'all', label: '셋 다 켬(중복 제거)', short: '합침', m: 0, per: 0,
    lines: all.length,
    full: gradePool(all, winNumbers, bonus),
    equal: gradePoolTop(all, n, winNumbers, bonus),
  });
  return rows;
}

/* 🆕 v18 — 검증용 접근점.
   Babel 이 이 스크립트를 자기 스코프에서 돌려 함수들이 전역에 없다.
   verify_par_modes.mjs 가 계산부를 **실제 파일 그대로** 두드릴 수 있도록 여기만 열어 둔다.
   화면 동작에는 관여하지 않는다(읽기 전용 참조). */
if (typeof window !== 'undefined') {
  window.__par = { PAR_MODES, PAR_MODE_DEFAULT, parMode, nCk,
                   parallelLine, parallelCombos, parallelAll, parEqualN,
                   parallelUnion, parUnionCount };
}

// 조합 묶음 채점 — 3개 이상 적중 줄 수 / 최고 적중
function gradePool(combos, winNumbers, bonus) {
  const win = {};
  winNumbers.forEach(n => { win[n] = 1; });
  const hasB = (bonus >= 1 && bonus <= 45);
  const dist = [0, 0, 0, 0, 0, 0, 0];
  const uniq = {};
  let best = null;
  combos.forEach((c, i) => {
    let m = 0;
    for (const n of c) if (win[n]) m++;
    dist[m]++;
    uniq[c.join(',')] = 1;
    const b = hasB && c.indexOf(bonus) >= 0;
    if (!best || m > best.hits || (m === best.hits && b && !best.bonus))
      best = { idx: i + 1, hits: m, numbers: c, bonus: b };
  });
  const games = combos.length;
  const hit3 = dist[3] + dist[4] + dist[5] + dist[6];
  if (best) best.label = best.hits === 6 ? '6개'
    : (best.hits === 5 && best.bonus) ? '5개+보' : `${best.hits}개${best.bonus ? '+보' : ''}`;
  return { games, unique: Object.keys(uniq).length, dist, hit3, rate: games ? hit3 / games : 0, best };
}

// 한 회차 소급 검증 — 그 회차 "직전 데이터"만으로 병렬 전체 줄 vs 단일 전략 45줄을 비교한다
// ⚠️ 미래 정보 차단: priorHist 는 반드시 rec.round 보다 앞선 회차들만 넘긴다
function parBacktestRound(rec, priorHist) {
  const eng = computeEngine(priorHist);
  const S = buildStrategies(eng);
  const built = buildRankings(eng, S);
  const ft = freqTable(rec);
  const ord = axisOrders(eng, built.ranks, ft);
  const keys = axisKeys(ord);
  const par = parallelAll(ord, keys);
  const solo = [];
  for (const k of DISPLAY_ORDER)
    for (let i = 1; i <= PAR_SOLO_LINES; i++) {
      const l = buildLine(k, i, built.ranks, built.anti);
      if (l) solo.push(l.numbers);
    }
  return {
    round: rec.round, base: eng.baseRange, axes: keys.length, lines: ft.lines,
    myAxis: !!ord.MY,
    par: gradePool(par.map(p => p.numbers), rec.winNumbers, rec.bonus),
    solo: gradePool(solo, rec.winNumbers, rec.bonus)
  };
}

/* 🆕 v18 — 채점·비교 함수도 검증용으로 열어 둔다(위 __par 에 이어 붙인다) */
if (typeof window !== 'undefined' && window.__par) {
  window.__par.gradePool = gradePool;
  window.__par.gradePoolTop = gradePoolTop;
  window.__par.parCompareModes = parCompareModes;
  /* 실제 과거 회차로 대조하려면 순위표를 만드는 앞단도 필요하다 */
  window.__par.computeEngine = computeEngine;
  window.__par.buildStrategies = buildStrategies;
  window.__par.buildRankings = buildRankings;
  window.__par.axisOrders = axisOrders;
  window.__par.axisKeys = axisKeys;
}

// ===== 🔗 병렬 결과 · 매칭 탭 하단 (모의 실험 이력의 "병렬" 카테고리) =====
function ParSection({ saved, dark, card, textDim, onDel }) {
  const hist = useMemo(() => (saved || [])
    .filter(r => r && r.par && Array.isArray(r.par.combos) && r.par.combos.length > 0)
    .sort((a, b) => b.round - a.round)
    .map(r => ({
      round: r.round, rec: r, par: r.par,
      stale: !!(r.par.myAxis && r.par.srcLines !== (r.games || []).length),
      score: (Array.isArray(r.winNumbers) && r.winNumbers.length === 6)
        ? gradePool(r.par.combos, r.winNumbers, r.bonus) : null
    })), [saved]);

  const scored = hist.filter(h => h.score);
  const sum = scored.length > 0 ? {
    rounds: scored.length,
    games: scored.reduce((s, h) => s + h.score.games, 0),
    hit3: scored.reduce((s, h) => s + h.score.hit3, 0),
    best: scored.reduce((m, h) => Math.max(m, h.score.best ? h.score.best.hits : 0), 0)
  } : null;
  if (sum) sum.expect = sum.games * MOCK_P3;

  const soft = dark ? 'bg-slate-700/50' : 'bg-slate-50';
  const line = dark ? 'border-slate-700' : 'border-slate-200';
  const tone = (ratio) => ratio >= 1.5 ? 'text-orange-500' : (ratio <= 0.5 ? 'text-blue-500' : textDim);

  return (
    <div className={`${card} rounded-2xl shadow-md p-4 border-2 ${dark ? 'border-fuchsia-900' : 'border-fuchsia-200'}`}>
      <div className="font-bold mb-1 flex items-center gap-2">
        <Link2 className="w-4 h-4 text-fuchsia-500" /> 🔗 병렬 조합 결과
      </div>
      <div className={`text-[11px] ${textDim} mb-3 leading-relaxed`}>
        모의 실험 이력의 <strong>병렬 카테고리</strong>입니다. 자동 생성한 전체 축 조합 줄을 따로 누적 집계하며
        <strong> 실구매 기록·손익 통계와 섞이지 않습니다</strong>.
      </div>

      {hist.length === 0 ? (
        <div className={`${dark ? 'bg-amber-900/30 text-amber-200' : 'bg-amber-50 text-amber-900'} rounded-xl p-3 text-xs leading-relaxed`}>
          아직 자동 생성한 병렬 줄이 없습니다. 생성 탭의 <strong>🔗 병렬 조합</strong>에서 [자동 전체 생성]을 눌러 주세요.
        </div>
      ) : (
        <div className="space-y-2">
          {hist.map(h => (
            <div key={h.round} className={`${soft} rounded-xl px-3 py-2`}>
              <div className="flex items-center gap-2">
                <span className="font-bold text-sm w-14 shrink-0">{h.round}회</span>
                <span className={`text-[11px] ${textDim}`}>
                  {h.par.axes}축 · {h.par.combos.length}줄
                  {h.score && h.score.unique < h.score.games ? ` (고유 ${h.score.unique})` : ''}
                  {h.par.substituted ? ' · 대체 있음' : ''}
                </span>
                <button onClick={() => onDel(h.round)} className={`ml-auto text-[11px] ${textDim} active:scale-95`}>삭제</button>
              </div>
              {h.stale && (
                <div className={`text-[11px] mt-1 font-semibold ${dark ? 'text-amber-300' : 'text-amber-700'}`}>
                  ⚠️ 생성 이후 이 회차 줄이 {h.par.srcLines} → {(h.rec.games || []).length}줄로 바뀌어
                  📊 내 빈도 축이 달라졌습니다. 다시 생성하세요.
                </div>
              )}
              {!h.score ? (
                <div className={`text-[11px] ${textDim} mt-1`}>추첨 후 이 회차를 매칭하면 자동으로 채점됩니다.</div>
              ) : (
                <div className="mt-1.5">
                  <div className="flex items-baseline gap-2">
                    <span className={`text-xl font-bold ${tone(h.score.hit3 / (h.score.games * MOCK_P3))}`}>{h.score.hit3}</span>
                    <span className={`text-[11px] ${textDim}`}>
                      줄 3개 이상 · 기대치 {(h.score.games * MOCK_P3).toFixed(1)} · 최고 {h.score.best ? h.score.best.label : '-'}
                    </span>
                  </div>
                  <div className={`text-[11px] ${textDim} mt-0.5`}>
                    적중 분포 — {[6, 5, 4, 3].map(k => `${k}개 ${h.score.dist[k]}`).join(' · ')}
                  </div>
                  {h.score.best && h.score.best.hits >= 3 && (
                    <div className="mt-1">
                      <div className="flex items-center gap-1 flex-wrap">
                        {h.score.best.numbers.map(n => (
                          <Ball key={n} n={n} sm
                            hit={h.rec.winNumbers.indexOf(n) >= 0}
                            bonus={h.rec.bonus === n} />
                        ))}
                      </div>
                      {h.par.labels && h.par.labels[h.score.best.idx - 1] && (
                        <div className={`text-[10px] ${textDim} mt-0.5`}>출처 {h.par.labels[h.score.best.idx - 1]}</div>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {sum && (
        <div className={`text-[11px] ${textDim} mt-3 pt-3 border-t ${line} leading-relaxed`}>
          <strong>병렬 누적</strong> — {sum.rounds}회 · {sum.games.toLocaleString()}줄 중 3개 이상{' '}
          <strong>{sum.hit3}</strong>줄 (기대치 {sum.expect.toFixed(1)}) →{' '}
          <strong className={tone(sum.hit3 / sum.expect)}>
            기대치의 {sum.expect > 0 ? (sum.hit3 / sum.expect * 100).toFixed(0) : 0}%
          </strong>
          {' '}· 역대 최고 {sum.best}개 — 회차가 쌓일수록 이 규칙의 장기 성적이 드러납니다.
        </div>
      )}
    </div>
  );
}

// ===== 📊 빈도 분석 패널 (저장 탭 회차 카드 안) =====
// 화면1: 추첨 전 — 많이 겹친 순서 · 미포함 번호 / 화면2: 매칭 후 자동 확장 — 당첨번호의 내 빈도 순위
function FreqPanel({ r, dark, textDim }) {
  const ft = useMemo(() => freqTable(r), [r]);
  const prof = useMemo(() => winProfile(r, ft), [r, ft]);
  const matched = !!r.matches;
  const [open, setOpen] = useState(matched);
  const [more, setMore] = useState(false);
  useEffect(() => { if (matched) setOpen(true); }, [matched]);

  const used = ft.rows.filter(x => x.count > 0);
  const big = used.filter(x => x.count >= 5);
  const head = big.length > 0 ? big : used.slice(0, 7);   // 5회 이상이 없으면 상위 7개만 크게
  const rest = used.filter(x => head.indexOf(x) < 0);
  const line = dark ? 'border-slate-700' : 'border-slate-200';
  const soft = dark ? 'bg-slate-700/40' : 'bg-slate-50';

  return (
    <div className={`px-3 pb-3 pt-2 border-t ${line}`}>
      <button onClick={() => setOpen(!open)}
        className={`w-full py-2 rounded-xl text-xs font-bold active:scale-95 flex items-center justify-center gap-1.5 ${dark ? 'bg-slate-700 text-slate-200' : 'bg-slate-100 text-slate-700'}`}>
        📊 빈도 분석 <span className={`font-normal ${textDim}`}>({ft.lines}줄 · 사용 {used.length}/45)</span> {open ? '▲' : '▼'}
      </button>

      {open && (
        <div className="mt-2.5">
          {/* ── 화면1: 많이 겹친 순서 ── */}
          <div className={`text-[11px] ${textDim} mb-1.5`}>
            {big.length > 0
              ? <>5회 이상 겹친 번호 <strong>{big.length}개</strong> — 많이 겹친 순</>
              : <>5회 이상 겹친 번호가 없어 상위 {head.length}개만 표시</>}
          </div>
          <div className="space-y-1">
            {head.map(x => (
              <div key={x.n} className={`flex items-center gap-2 py-1.5 px-2 rounded-lg ${soft}`}>
                <span className={`w-9 text-xs font-bold text-right shrink-0 ${x.rank <= 7 ? 'text-emerald-500' : textDim}`}>{x.rank}위</span>
                <Ball n={x.n} />
                <span className="text-sm font-bold w-10 shrink-0">{x.count}회</span>
                <div className="flex-1 min-w-0">
                  <div className={`h-1.5 rounded-full overflow-hidden ${dark ? 'bg-slate-700' : 'bg-slate-200'}`}>
                    <div className="h-full rounded-full bg-gradient-to-r from-emerald-500 to-teal-500"
                      style={{ width: `${used.length ? (x.count / used[0].count) * 100 : 0}%` }} />
                  </div>
                  <StratChips list={x.stratList} dark={dark} />
                </div>
              </div>
            ))}
          </div>

          {rest.length > 0 && (
            <>
              <button onClick={() => setMore(!more)}
                className={`w-full mt-2 py-1.5 rounded-xl text-[11px] font-semibold active:scale-95 ${dark ? 'bg-slate-700 text-slate-300' : 'bg-slate-100 text-slate-600'}`}>
                {more ? '접기 ▲' : `나머지 ${rest.length}개 더보기 ▼`}
              </button>
              {more && (
                <div className="grid grid-cols-5 gap-1.5 mt-2">
                  {rest.map(x => (
                    <div key={x.n} className={`rounded-lg py-1.5 text-center ${soft}`}>
                      <div className={`text-[9px] ${textDim}`}>{x.rank}위</div>
                      <div className="flex justify-center my-0.5"><Ball n={x.n} sm /></div>
                      <div className="text-[10px] font-semibold">{x.count}회</div>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}

          <div className={`text-[11px] mt-2 leading-relaxed rounded-xl px-3 py-2 ${ft.missing.length > 0
            ? (dark ? 'bg-slate-700/50 text-slate-300' : 'bg-slate-100 text-slate-600')
            : (dark ? 'bg-emerald-900/30 text-emerald-200' : 'bg-emerald-50 text-emerald-700')}`}>
            {ft.missing.length > 0
              ? <>미포함: <strong>{ft.missing.join('·')}번</strong> ({ft.missing.length}개) — 이 번호가 나오면 그 자리는 못 맞춥니다</>
              : <>미포함 없음 — 1~45번을 모두 실었습니다</>}
          </div>

          {/* ── 화면2: 매칭 후 (자동 확장) ── */}
          {prof && (
            <div className={`mt-3 pt-3 border-t ${line}`}>
              <div className="text-xs font-bold mb-2">🎯 당첨번호가 내 빈도 몇 위였나</div>

              {prof.missing.length > 0 && (
                <div className={`text-[11px] leading-relaxed rounded-xl px-3 py-2 mb-2 ${dark ? 'bg-red-900/30 text-red-200 border border-red-800' : 'bg-red-50 text-red-700 border border-red-200'}`}>
                  ⚠️ 당첨번호 중 <strong>{prof.missing.join('·')}번</strong>이 이 회차 {ft.lines}줄 어디에도 없었습니다.
                  <div className="mt-1">이 번호가 빠진 이상 <strong>{r.round}회차는 1등이 원천 불가능</strong>했습니다.</div>
                </div>
              )}

              <div className="space-y-1">
                {prof.win.map(w => (
                  <div key={w.n} className={`flex items-center gap-2 py-1 px-2 rounded-lg ${w.top7 ? (dark ? 'bg-emerald-900/30' : 'bg-emerald-50') : w.missing ? (dark ? 'bg-red-900/20' : 'bg-red-50') : ''}`}>
                    <Ball n={w.n} sm />
                    <span className="text-xs">→ 내 빈도 <strong className="text-sm">{w.rank}위</strong></span>
                    <span className={`text-[10px] ${textDim}`}>({w.count}회)</span>
                    <span className="ml-auto shrink-0">
                      {w.top7 && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-emerald-500 text-white">★적중</span>}
                      {w.missing && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-red-500 text-white">⚠️미보유</span>}
                    </span>
                  </div>
                ))}
                {prof.bonus && (
                  <div className={`flex items-center gap-2 py-1 px-2 rounded-lg border-t ${line}`}>
                    <Ball n={prof.bonus.n} sm bonus />
                    <span className={`text-[10px] ${textDim} shrink-0`}>보너스</span>
                    <span className="text-xs">→ 내 빈도 <strong className="text-sm">{prof.bonus.rank}위</strong></span>
                    <span className={`text-[10px] ${textDim}`}>({prof.bonus.count}회)</span>
                    <span className="ml-auto shrink-0">
                      {prof.bonus.top7 && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-emerald-500 text-white">★적중</span>}
                      {prof.bonus.missing && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-red-500 text-white">⚠️미보유</span>}
                    </span>
                  </div>
                )}
              </div>

              <div className="grid grid-cols-3 gap-2 mt-2.5">
                <div className={`rounded-xl py-2 text-center ${soft}`}>
                  <div className={`text-[10px] ${textDim}`}>평균 빈도순위</div>
                  <div className="text-lg font-bold">{prof.avgRank.toFixed(1)}위</div>
                </div>
                <div className={`rounded-xl py-2 text-center ${soft}`}>
                  <div className={`text-[10px] ${textDim}`}>빈도 TOP7 적중</div>
                  <div className="text-lg font-bold text-emerald-500">{prof.top7Hits}<span className={`text-xs font-normal ${textDim}`}>/7</span></div>
                </div>
                <div className={`rounded-xl py-2 text-center ${soft}`}>
                  <div className={`text-[10px] ${textDim}`}>미보유 당첨번호</div>
                  <div className={`text-lg font-bold ${prof.missing.length > 0 ? 'text-red-500' : ''}`}>{prof.missing.length}<span className={`text-xs font-normal ${textDim}`}>/6</span></div>
                </div>
              </div>
              <div className={`text-[10px] ${textDim} mt-1.5 leading-relaxed`}>
                ★적중 = 내 빈도 TOP7 안에 들어 있던 당첨번호 · 우연히 겹칠 기대치는 회차당 {TOP7_EXPECT.toFixed(2)}개
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const MAX_LINES = 50;
const BATCH_SIZE = 5;

// ===== 오늘 날짜 기준 '구매 대상' 회차 자동 계산 =====
// ===== 🧪 모의 실험 섹션 (매칭 탭 하단) =====
function MockSection({ saved, dark, card, text, textDim, inputBase, mode, manualRanks, onModeSave, onGen, onDel, busy }) {
  const { target, prev } = useMemo(() => pickMockRounds(saved), [saved]);
  const autoProf = useMemo(() => (prev ? rankProfileOf(prev) : null), [prev]);
  // 적용 프로필: 자동(직전 회차에서 계산) / 수동(설정에 고정한 순위)
  const profile = (mode === 'manual') ? manualRanks : (autoProf ? autoProf.ranks : null);
  const plan = useMemo(() => {
    try { return (target && profile) ? buildMockPlan(profile, target) : null; } catch (e) { return null; }
  }, [target, profile && profile.join(',')]);

  const [rkInput, setRkInput] = useState((manualRanks || []).join(', '));
  useEffect(() => { setRkInput((manualRanks || []).join(', ')); }, [manualRanks]);

  const mock = target ? target.mock : null;
  const score = useMemo(() =>
    (mock && target && target.winNumbers) ? scoreMock(mock, target.winNumbers, target.bonus) : null,
    [mock, target]);
  const history = useMemo(() => (saved || [])
    .filter(r => r && r.mock && Array.isArray(r.mock.combos) && r.mock.combos.length > 0)
    .sort((a, b) => b.round - a.round)
    .map(r => ({ round: r.round, mock: r.mock, score: scoreMock(r.mock, r.winNumbers, r.bonus) })),
    [saved]);

  const soft = dark ? 'bg-slate-700/50' : 'bg-slate-50';
  const line = dark ? 'border-slate-700' : 'border-slate-200';
  const toneColor = (t) => t === 'up' ? 'text-orange-500' : (t === 'down' ? 'text-blue-500' : textDim);

  // 줄이 늘거나 프로필이 바뀌면 예전 설계도로 만든 가상 게임은 지금 기준과 맞지 않는다
  const staleLines = !!(mock && target && mock.srcLines !== target.games.length);
  const staleProfile = !!(mock && profile && (mock.profile || []).join(',') !== profile.join(','));
  const stale = staleLines || staleProfile;

  const hist = history.filter(h => h.score);
  const histSum = hist.length > 0 ? {
    rounds: hist.length,
    games: hist.reduce((s, h) => s + h.score.games, 0),
    hit3: hist.reduce((s, h) => s + h.score.hit3, 0),
    expect: hist.reduce((s, h) => s + h.score.expect, 0),
    best: hist.reduce((m, h) => Math.max(m, h.score.best ? h.score.best.hits : 0), 0)
  } : null;

  return (
    <div className={`${card} rounded-2xl shadow-md p-4 border-2 ${dark ? 'border-cyan-900' : 'border-cyan-200'}`}>
      <div className="font-bold mb-1 flex items-center gap-2">
        <FlaskConical className="w-4 h-4 text-cyan-500" /> 🧪 모의 실험
      </div>
      <div className={`text-[11px] ${textDim} mb-3 leading-relaxed`}>
        <strong>순위 자리 매칭</strong> 규칙으로 가상 게임을 만들어 채점합니다.
        실제로 사지 않은 줄이며 <strong>실구매 기록·손익 통계와 절대 섞이지 않습니다</strong>.
      </div>

      {/* 프로필 설정 — 자동(기본) / 수동 고정 */}
      <div className={`${soft} rounded-xl p-3 mb-3`}>
        <div className={`text-[11px] font-semibold ${textDim} mb-1.5`}>순위 프로필</div>
        <div className="grid grid-cols-2 gap-2 mb-2">
          <button onClick={() => onModeSave('auto', manualRanks)}
            className={`py-2 rounded-lg text-xs font-bold active:scale-95 border-2 ${mode === 'auto'
              ? 'border-cyan-500 text-cyan-600' : `${line} ${textDim}`}`}>
            자동 (직전 회차) {mode === 'auto' ? '✓' : ''}
          </button>
          <button onClick={() => onModeSave('manual', manualRanks)}
            className={`py-2 rounded-lg text-xs font-bold active:scale-95 border-2 ${mode === 'manual'
              ? 'border-cyan-500 text-cyan-600' : `${line} ${textDim}`}`}>
            수동 고정 {mode === 'manual' ? '✓' : ''}
          </button>
        </div>
        {mode === 'auto' ? (
          <div className={`text-[10px] ${textDim} leading-relaxed`}>
            {autoProf
              ? <>직전 매칭 회차 <strong>{autoProf.round}회</strong>({autoProf.lines}줄)의 당첨번호가 내 빈도표에서 몇 위였는지로 매주 자동 계산합니다.</>
              : <>직전 매칭 완료 회차가 없어 자동 계산을 할 수 없습니다. 지난 회차를 매칭하거나 [수동 고정]을 쓰세요.</>}
          </div>
        ) : (
          <>
            <div className="flex gap-2">
              <input type="text" value={rkInput} inputMode="numeric"
                onChange={e => setRkInput(e.target.value)} placeholder="6, 15, 26, 26, 43, 43"
                className={`flex-1 px-3 py-2 text-center text-sm font-bold border-2 ${inputBase} rounded-lg focus:border-cyan-500 focus:outline-none`} />
              <button onClick={() => onModeSave('manual', rkInput)}
                className="bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-bold active:scale-95">적용</button>
            </div>
            <div className={`text-[10px] ${textDim} mt-1.5 leading-relaxed`}>
              순위 6개(1~45)를 직접 고정합니다. 매주 직전 회차로 다시 계산하지 않습니다.
              {autoProf && ` (참고 · 자동값은 ${autoProf.round}회 기준 ${autoProf.ranks.join('·')}위)`}
            </div>
          </>
        )}
        {profile && (
          <div className={`text-[11px] mt-2 pt-2 border-t ${line}`}>
            <span className={textDim}>적용 프로필 · </span>
            <span className="font-bold text-cyan-600">{profile.join(', ')}위</span>
            <span className={textDim}> ({mode === 'auto' ? `${autoProf.round}회 자동` : '수동 고정'})</span>
          </div>
        )}
        {mode === 'auto' && autoProf && (
          <div className={`text-[10px] ${textDim} mt-1`}>
            {autoProf.detail.map(d => `${d.n}번 ${d.rank}위(${d.count}줄)`).join(' · ')}
          </div>
        )}
      </div>

      {/* 재료 부족 안내 */}
      {(!target || !profile || !plan) && (
        <div className={`${dark ? 'bg-amber-900/30 text-amber-200' : 'bg-amber-50 text-amber-900'} rounded-xl p-3 text-xs leading-relaxed`}>
          <div className="font-bold mb-1 flex items-center gap-1"><AlertCircle className="w-4 h-4" /> 재료 부족</div>
          {!target && <p>이번 회차에 저장된 줄이 없습니다. 생성 탭에서 줄을 먼저 만드세요.</p>}
          {target && !profile && <p>순위 프로필이 없습니다. 지난 회차를 매칭하거나 [수동 고정]으로 순위 6개를 넣어 주세요.</p>}
          {target && profile && !plan && <p>{target.round}회차 빈도표로는 6개 번호를 뽑을 수 없습니다.</p>}
        </div>
      )}

      {/* 설계도 + 모의 생성 버튼 */}
      {plan && (
        <div className={`${soft} rounded-xl p-3 space-y-2`}>
          <div className="text-xs">
            <span className="font-bold text-cyan-600">[{plan.profile.join(', ')}위]</span>
            <span className={textDim}> → </span>
            <span className="font-bold text-cyan-600">{plan.round}회</span>
            <span className={textDim}> 가상 게임 ({plan.srcLines}줄 빈도표 기준)</span>
          </div>
          <div className="flex flex-wrap gap-1">
            {plan.groups.map(g => (
              <span key={g.rank} className={`text-[10px] px-1.5 py-0.5 rounded-full font-semibold ${g.subs.length > 0
                ? (dark ? 'bg-amber-900/60 text-amber-200' : 'bg-amber-100 text-amber-800')
                : (dark ? 'bg-cyan-900/60 text-cyan-200' : 'bg-cyan-100 text-cyan-800')}`}>
                {g.rank}위({g.count}줄) {g.pool.length}개 중 {g.take}개
                {g.take === g.pool.length ? ' · 확정' : ''}
                {g.subs.length > 0 && ` · ${g.subs.join('·')}위 대체됨`}
              </span>
            ))}
          </div>
          <div className={`text-[11px] ${textDim} leading-relaxed`}>
            {plan.total.toLocaleString()}게임 · {plan.poolNums.length}개 번호만 사용

            {plan.poolNums.length <= 20 && ' · 몰빵 구조 ⚠️'}

          <div className="flex flex-wrap gap-1">
            {plan.poolNums.map(n => <Ball key={n} n={n} sm />)}
          </div>
          {plan.total > MOCK_MAX && (
            <div className={`text-[11px] font-semibold ${dark ? 'text-amber-300' : 'text-amber-700'}`}>
              ⚠️ 조합 {plan.total.toLocaleString()}개 &gt; 상한 {MOCK_MAX.toLocaleString()}개 — 무작위 {MOCK_MAX.toLocaleString()}개만 샘플링합니다
            </div>
          )}
          <button onClick={() => onGen(plan, mode)} disabled={busy}
            className="w-full bg-gradient-to-r from-cyan-500 to-teal-500 text-white py-2.5 rounded-lg text-sm font-bold flex items-center justify-center gap-1 active:scale-95 disabled:opacity-50">
            {busy ? <Loader2 className="w-4 h-4 animate-spin" /> : <FlaskConical className="w-4 h-4" />}
            {mock ? '모의 다시 생성' : '모의 생성'}

        </div>
      )}

      {/* 생성 결과 + 자동 채점 */}
